<!DOCTYPE html>
<html>

<head>
    <title>Real time data validation using java script</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin: 30px 0 10px;
            font-size: 34px;
            font-weight: bold;
        }

        hr {
            width: 85%;
            border: none;
            border-top: 2px solid #ddd;
            margin-bottom: 25px;
        }

        .box {
            width: 420px;
            margin: auto;
            border: 2px solid #bbb;
            padding: 18px;
        }

        .row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 10px 0;
        }

        label {
            width: 90px;
            text-align: right;
            font-size: 18px;
        }

        input {
            height: 24px;
            padding: 4px;
            border: 1px solid #999;
        }

        #email,
        #password {
            width: 170px;
        }

        #age {
            width: 55px;
        }

        button {
            margin-top: 10px;
            padding: 4px 14px;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            font-weight: 500;
            font-size: 22px;
        }
    </style>
</head>

<body>
    <h1>Real time data validation</h1>
    <hr>
    <div class="box">
        <div class="row">
            <label>Email :</label>
            <input type="email" id="email" placeholder="Enter your email">
        </div>
        <div class="row">
            <label>Password :</label>
            <input type="password" id="password" placeholder="Enter your password">
        </div>
        <div class="row">
            <label>Age :</label>
            <input type="number" id="age" placeholder="Enter your age">
        </div>
        <button type="submit">Login</button>
    </div>
    <p id="message"></p>
    <script src="script2.js"></script>
</body>

</html>
